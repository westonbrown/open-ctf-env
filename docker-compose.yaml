# Open CTF Environment - Docker Compose
#
# Single Dockerfile with multi-stage build targets:
#   docker/Dockerfile → targets: base, sft, sft-trl, grpo
#
# Usage:
#   docker compose run --rm sft        # Stage 1: SFT
#   docker compose run --rm sft-trl    # Stage 1: SFT (TRL backend)
#   docker compose run --rm merge      # Merge LoRA adapter
#   docker compose run --rm grpo       # Stage 2: GRPO
#   docker compose run --rm validate   # Validate pipeline
#   docker compose run --rm export     # Export to GGUF
#
# Override model/data paths via environment or .env file.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  shm_size: "64g"

x-volumes: &volumes
  volumes:
    - ./data:/workspace/data
    - ./outputs:/workspace/outputs
    - ./configs:/workspace/configs

services:
  # Stage 1: SFT via LlamaFactory
  sft:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sft
    <<: [*gpu, *volumes]
    command: >
      open-ctf-train sft
        --model ${MODEL:-Nanbeige/Nanbeige4.1-3B}
        --data /workspace/data/${SFT_DATA:-sft.jsonl}
        --output /workspace/outputs/sft
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}

  # Stage 1: SFT via TRL backend (for newer model families, e.g. Qwen3.5)
  sft-trl:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sft-trl
    <<: [*gpu, *volumes]
    command: >
      open-ctf-train sft
        --backend trl
        --model ${MODEL:-Qwen/Qwen3.5-27B}
        --data /workspace/data/${SFT_DATA:-sft.jsonl}
        --output /workspace/outputs/sft
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}

  # Merge LoRA adapter into base (uses SFT image)
  merge:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sft
    <<: [*gpu, *volumes]
    command: >
      open-ctf-train merge
        --adapter ${ADAPTER:-/workspace/outputs/sft}
        --base-model ${MODEL:-Nanbeige/Nanbeige4.1-3B}
        --output /workspace/outputs/sft-merged
    environment:
      - HF_TOKEN=${HF_TOKEN:-}

  # Stage 2: GRPO via SkyRL (requires merged model)
  grpo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: grpo
    <<: [*gpu, *volumes]
    command: >
      open-ctf-train grpo
        --model ${GRPO_MODEL:-/workspace/outputs/sft-merged}
        --data /workspace/data/${GRPO_DATA:-grpo_offline_683.jsonl}
        --output /workspace/outputs/grpo
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}

  # Validation (uses base — no heavy ML deps needed)
  validate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    <<: *volumes
    command: open-ctf-validate

  # Export to GGUF (uses SFT image for merge + export tools)
  export:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sft
    <<: [*gpu, *volumes]
    command: >
      open-ctf-export
        --adapter ${ADAPTER:-/workspace/outputs/sft}
        --base-model ${MODEL:-Nanbeige/Nanbeige4.1-3B}
        --output /workspace/outputs/model.gguf
        --quant ${QUANT:-Q4_K_M}
