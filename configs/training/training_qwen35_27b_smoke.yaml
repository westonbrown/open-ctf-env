# Qwen3.5-27B GRPO smoke config (2x B200: trainer on GPU1, vLLM on GPU0)
# Purpose: fast online-RL sanity pass (tool execution + reward + policy update)

model:
  name: "Qwen/Qwen3.5-27B"
  max_seq_length: 49152
  load_in_4bit: false
  load_in_8bit: false

lora:
  r: 64
  alpha: 128
  dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

online_rl:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  warmup_ratio: 0.10
  beta: 0.0
  loss_type: dapo
  num_generations: 2
  advantage_estimator: rloo
  max_completion_length: 1024
  max_tool_calling_iterations: 8
  drop_unresolved_registry_samples: true
  use_new_inference: true
  allow_new_inference_for_qwen35: true
  enable_prefix_caching: false
  enable_chunked_prefill: true
  enforce_eager: true
  # Keep smoke limits aligned with real multi-turn prompt growth to avoid
  # decoder prompt > max_model_len failures during tool loops.
  max_prompt_length: 8192
  vllm_max_model_len: 16384
  vllm_language_model_only: true
  # Force Triton attention backend to avoid PTX/toolchain incompatibilities
  # observed with flash-kernel paths on this runtime.
  vllm_attention_backend: "TRITON_ATTN"
  max_grad_norm: 0.1
  epsilon_high: 0.28
  weight_decay: 0.1
  scale_rewards: false
  use_vllm: true
  vllm_mode: server
  vllm_server_url: null
  gpu_memory_utilization: 0.68
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  flash_attn: false
  use_sample_packing: false
  require_fast_linear_attention: true
  pytorch_cuda_alloc_conf: "expandable_segments:True"
  tool_call_format: qwen3_coder
  chat_template: "qwen3_without_thinking"
  chat_template_kwargs:
    enable_thinking: true
  zero_variance_filter: true
  dynamic_sampling:
    type: "filter"
    max_sample_batches: 5
  step_wise_trajectories: true
  agent_class: open_ctf.agent.default_agent.DefaultStepAgent
  allow_step_wise_with_custom_chat_template: true
  agent_kwargs:
    max_consecutive_no_tool_calls: 2
    runtime_cmd: "python src/open_ctf/agent/framework_runtime_bridge.py"
    runtime_timeout_seconds: 20
    runtime_passthrough: false
    runtime_fallback_to_parser: false
    runtime_env:
      OPEN_CTF_AGENT_FRAMEWORK: "boxpwnr_langgraph"
      OPEN_CTF_AGENT_MODE: "tool_calls"

reward:
  flag_weight: 0.20
  efficiency_weight: 0.20
  progression_weight: 0.12
  exploration_weight: 0.08
  uniqueness_weight: 0.08
  format_weight: 0.15
  recovery_weight: 0.07
  cognitive_weight: 0.10
  hallucination_penalty: 0.10
  noise_range: 0.05
  exploration_gamma: 0.95
  use_gdpo: false

output:
  save_steps: 1
  logging_steps: 1
  report_to: tensorboard

online_rl_logging:
  enable_trajectory_logging: true
