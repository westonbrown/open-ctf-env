# DGX Spark (GB10) Training Configuration
# =========================================
# Online GRPO with vLLM server mode on RunPod H200 (141GB VRAM).
# SFT runs locally on DGX Spark; GRPO generation offloaded to vLLM server.
#
# Quantization options (MoE models like GLM-4.7-Flash):
#
#   4-bit NF4 (~18GB):  Best option. Uses post-load quantization of MoE
#     expert 3D tensors via bitsandbytes >= 0.48 replace_parameter_4bit.
#     Standard BnB only quantizes nn.Linear; expert nn.Parameter tensors
#     are handled separately after model load. Saves ~45GB vs BF16.
#     Requires: bitsandbytes >= 0.48.0, peft >= 0.14.0
#
#   8-bit INT8 (~30GB):  Fallback. prepare_model_for_kbit_training is
#     SKIPPED (OOMs for MoE due to fp32 cast). Instead we manually call
#     enable_input_require_grads.
#
#   BF16 (~60GB):  No quantization. Only fits with completion <= 512.

model:
  name: "unsloth/GLM-4.7-Flash"
  # 64K captures 97% of SFT traces (vs 85% at 32K, 60% at 16K).
  # RunPod H200 (141GB) has headroom; DGX Spark (119GB) may need 32K.
  max_seq_length: 65536
  # 4-bit NF4: model ~18GB (nn.Linear 4-bit + MoE expert post-load 4-bit).
  # Frees ~42GB vs INT8 for longer completions (4096 vs 2048).
  # Requires bitsandbytes >= 0.48.0 for replace_parameter_4bit API.
  load_in_4bit: true
  load_in_8bit: false

lora:
  r: 64
  # alpha=2r: standard ratio for stronger LoRA signal through the bottleneck.
  # Higher alpha/r ratio amplifies low-rank updates without increasing params.
  alpha: 128
  dropout: 0
  # Attention + shared expert layers targeted via target_modules (nn.Linear).
  # Routed MoE expert 3D tensors are quantized for memory savings but NOT
  # LoRA'd (PEFT only matches nn.Module, not fused 3D expert tensors).
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  # RSLoRA scales adapter by 1/sqrt(r) instead of 1/r. Currently disabled;
  # the alpha=2r ratio provides sufficient signal scaling.
  use_rslora: false

sft:
  # 5 epochs: OpenThoughts research shows short SFT (1-3 epochs) can underfit
  # with <1K samples, leading to unstable RL. Accuracy plateaus around epoch 10;
  # 5 is the sweet spot for our ~800 trace dataset.
  epochs: 5
  # batch_size MUST be 1 for GLM-4.7-Flash MoE — padding in batched inputs
  # causes NaN gradients (MoE routing produces NaN for padded positions).
  # Compensate with larger gradient_accumulation_steps for same effective batch.
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  packing: true
  # Memory budget for SFT on RunPod H200 (141 GB VRAM):
  #   Model (NF4 + post-load expert quant): ~17 GB
  #   LoRA adapters: ~1 GB
  #   Optimizer (8-bit AdamW): ~2 GB
  #   Gradient activations (checkpointed, 64K): ~60-80 GB
  #   Framework/OS: ~8 GB
  #   Total: ~88-108 GB -> ~33-53 GB headroom
  #
  # Memory budget for SFT on DGX Spark GB10 (119 GB unified):
  #   Same model/LoRA/optimizer costs. Activations at 32K: ~40-60 GB.
  #   Total: ~68-88 GB -> ~31-51 GB headroom (use max_seq_length=32768).
  #
  # Data: 827 BoxPwnr traces (sft.jsonl, HTB deduped to max 2 per challenge)
  #   ~97% fit within 64K tokens, ~78% within 32K, ~60% at 16K
  #   CyBench traces retained for training signal (not held out).

online_rl:
  epochs: 1
  batch_size: 1
  # Must satisfy: batch_size * gradient_accumulation_steps % num_generations == 0
  # With num_gen=8: 1 * 8 % 8 = 0 (valid).
  # Effective batch = batch_size * grad_accum / num_gen = 1 * 8 / 8 = 1 prompt.
  gradient_accumulation_steps: 8
  # 1e-6: Standard GRPO learning rate for MoE models. MoE expert activation
  # volatility (different experts fire per token) amplifies gradient noise;
  # lower LR prevents catastrophic forgetting of expert specialization.
  # Reference: DeepSeekMath GRPO uses 1e-6, ToolRL uses 1e-6.
  learning_rate: 1.0e-6
  warmup_ratio: 0.10
  # beta=0.0: No KL penalty (DAPO formulation). DAPO, ToolRL, and DeepSWE
  # all use beta=0.0. KL regularization is replaced by the epsilon clipping
  # (epsilon_high) which bounds per-token ratio deviation instead.
  beta: 0.0
  loss_type: dapo
  # Advantage estimator: rloo_n (REINFORCE Leave-One-Out, normalized).
  # Alternatives: grpo, rloo, reinforce++, gae.
  advantage_estimator: rloo_n
  # Memory budget for GRPO on 2x RunPod H200 (vLLM server mode):
  #   GPU 0 (vLLM server): BF16 model ~60 GB + KV cache ~10-15 GB = ~75 GB
  #   GPU 1 (training): NF4 ~18 GB + LoRA+optimizer ~3 GB +
  #     activations 16K ~30-50 GB + framework ~8 GB = ~59-79 GB
  #   Both fit in 141 GB per GPU with comfortable headroom.
  #
  # Fission-GRPO: 8 generations give C(8,2)=28 pairwise comparisons per prompt.
  # 4 is the floor for meaningful signal; 8 is the sweet spot balancing
  # diversity vs compute. More comparisons = sharper reward signal.
  num_generations: 8
  # 32K completions: full-length traces for complex multi-step CTF exploits.
  # Online mode generates incrementally via tool call iterations, so individual
  # turns are short even with high max_completion_length.
  max_completion_length: 32768
  # Online RL: max tool-calling iterations per generation.
  # Each iteration = generate -> parse tool calls -> execute -> regenerate.
  # Complex CTF challenges (IDOR enumeration, multi-step exploits) need 10-15
  # rounds. 15 allows full exploitation without artificial truncation.
  max_tool_calling_iterations: 15
  max_grad_norm: 0.1
  # DAPO epsilon clipping: bounds per-token importance ratio to [1-eps, 1+eps_high].
  # 0.28 is the standard DAPO value (wider than PPO's 0.2 for more exploration).
  epsilon_high: 0.28
  weight_decay: 0.1
  # DAPO does not need reward normalization — the group-relative baseline
  # already centers rewards. scale_rewards=false avoids distorting the
  # natural reward distribution (success ~1.0-2.0, failure ~0.0-0.2).
  scale_rewards: false
  # Default online-RL agent runtime via generic bridge.
  agent_class: open_ctf.agent.default_agent.DefaultStepAgent
  agent_kwargs:
    max_consecutive_no_tool_calls: 3
    runtime_cmd: "python src/open_ctf/agent/framework_runtime_bridge.py"
    runtime_timeout_seconds: 20
    runtime_passthrough: false
    runtime_fallback_to_parser: false
    runtime_env:
      OPEN_CTF_AGENT_FRAMEWORK: "boxpwnr_langgraph"
      OPEN_CTF_AGENT_MODE: "tool_calls"
  # vLLM 0.16.0 supports GLM-4.7-Flash. Server mode is safer than colocate
  # for MoE models: avoids weight sync issues with parametrized expert tensors
  # and mixed-dtype attention bugs. Generation runs on a separate vLLM process.
  use_vllm: true
  vllm_mode: "server"

output:
  save_steps: 25
  logging_steps: 1
  report_to: tensorboard

online_rl_logging:
  enable_trajectory_logging: true
