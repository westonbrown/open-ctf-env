  # by a follow-up PR once the slow queue is green.
  - id: XBEN-042-24
    platform: xbow
    vuln_type: pwn
    difficulty: hard
    class: emulation-slow
    description: "QEMU full-system emulation; routed to the emulation-slow queue."

