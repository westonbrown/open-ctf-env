# LlamaFactory SFT config for Qwen/Qwen3.5-27B (27B dense Qwen3ForCausalLM)
# ChatML template, qwen tool format, BF16 LoRA (no quantization on B200).
#
# Usage:
#   llamafactory-cli train configs/llamafactory/qwen35_27b.yaml
#   # Or via orchestrator:
#   open-ctf-train sft --model Qwen/Qwen3.5-27B --data data/sft.jsonl --output outputs/sft

### Model
model_name_or_path: Qwen/Qwen3.5-27B
trust_remote_code: true

### Training method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### Dataset
dataset: open_ctf_sft
dataset_dir: data
# Qwen3.5 uses same ChatML template as Qwen3.
# "qwen3" template uses ReasoningTemplate which auto-handles <think> tokens.
template: qwen3
# Qwen tool format: <tool_call> JSON </tool_call> (Hermes-compatible).
tool_format: qwen
# Thinking mode: enable_thinking=true (slow thinking) includes <think> tokens
# in loss computation so the model learns to generate reasoning.
# Set false for "fast thinking" (masks thinking from loss).
enable_thinking: true
cutoff_len: 65536
neat_packing: false
preprocessing_num_workers: 4
packing: true

### Output
output_dir: outputs/sft
logging_steps: 1
save_steps: 25
save_only_model: true
overwrite_output_dir: true
report_to: none

### Hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
optim: adamw_8bit
seed: 42
gradient_checkpointing: true
# Flash Attention: B200 HBM3e native support.
flash_attention: fa2

### No quantization — B200 has 183GB, BF16 LoRA fits comfortably.
# quantization_bit: 4
# quantization_method: bitsandbytes
