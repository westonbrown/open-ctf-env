# LlamaFactory SFT config for GPT-OSS 20B (MoE, Harmony format)
# 32 experts, top-4 routing, ~5.1B active per token.
#
# Usage:
#   llamafactory-cli train configs/llamafactory/gptoss_20b.yaml
#   # Or via orchestrator:
#   open-ctf-train sft --model unsloth/gpt-oss-20b-BF16 --data data/sft.jsonl --output outputs/sft

### Model
model_name_or_path: unsloth/gpt-oss-20b-BF16
trust_remote_code: true

### Training method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
# Attention layers only — DO NOT target MoE expert/router layers.
lora_target: q_proj,k_proj,v_proj,o_proj

### Dataset
dataset: open_ctf_sft
dataset_dir: data
# LlamaFactory has built-in gpt_oss template (Harmony format).
template: gpt_oss
# GPT-OSS uses Harmony tool calling, not Hermes/Qwen.
tool_format: default
cutoff_len: 32768
neat_packing: false
preprocessing_num_workers: 4
packing: true

### Output
output_dir: outputs/sft
logging_steps: 1
save_steps: 25
save_only_model: true
overwrite_output_dir: true
report_to: none

### Hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
optim: adamw_8bit
seed: 42
gradient_checkpointing: true
# Flash Attention 3: B200 HBM3e native support.
flash_attention: fa2

### Quantization (QLoRA 4-bit)
quantization_bit: 4
quantization_method: bitsandbytes
