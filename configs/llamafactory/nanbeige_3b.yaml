# LlamaFactory SFT config for Nanbeige4.1-3B (3B dense LlamaForCausalLM)
# Primary test model — fast validation, Hermes tool format, ChatML template.
#
# Usage:
#   llamafactory-cli train configs/llamafactory/nanbeige_3b.yaml
#   # Or via orchestrator:
#   open-ctf-train sft --model Nanbeige/Nanbeige4.1-3B --data data/sft.jsonl --output outputs/sft

### Model
model_name_or_path: Nanbeige/Nanbeige4.1-3B
trust_remote_code: true

### Training method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### Dataset
dataset: open_ctf_sft
dataset_dir: data
template: chatml
tool_format: qwen
cutoff_len: 65536
neat_packing: true
preprocessing_num_workers: 4
packing: true

### Output
output_dir: outputs/sft
logging_steps: 1
save_steps: 50
save_only_model: true
overwrite_output_dir: true
report_to: none

### Hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
# 5e-5: with LoRA alpha/r=128/64 (2.0x scaling), effective LR is 1e-4.
# 2e-4 base was too aggressive — caused catastrophic forgetting in SFT v4.
learning_rate: 5.0e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
optim: adamw_8bit
seed: 42
gradient_checkpointing: true

### Quantization (QLoRA 4-bit for dense models)
quantization_bit: 4
quantization_method: bitsandbytes
