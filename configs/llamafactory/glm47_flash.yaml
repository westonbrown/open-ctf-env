# LlamaFactory SFT config for GLM-4.7-Flash (30B MoE, ~3.6B active)
# 2x B200 GPUs (383GB total VRAM)
#
# MoE-specific constraints:
#   - batch_size=1 to avoid NaN gradients (padding tokens through MoE router)
#   - BF16 LoRA only (4-bit QLoRA breaks MoE routing)
#   - Router/shared_expert_gate excluded from LoRA targets
#
# Usage:
#   llamafactory-cli train configs/llamafactory/glm47_flash.yaml
#   # Or via orchestrator:
#   open-ctf-train sft --model /workspace/models/glm-4.7-flash --data data/sft.jsonl --output outputs/sft

### Model
model_name_or_path: /workspace/models/glm-4.7-flash
trust_remote_code: true

### Template (GLM-4.7 with tool calling)
template: glm4_7
tool_format: glm4_moe

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
# Attention + shared expert only (routed experts excluded per MoE best practice)
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### Dataset
dataset: open_ctf_sft
dataset_dir: /workspace/open-ctf-env/data
cutoff_len: 8192
packing: true

### Training
# batch_size=1 is REQUIRED for MoE — batch>1 causes NaN gradients
# (padding tokens flow through MoE router, producing NaN in backward pass)
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
optim: adamw_8bit
seed: 42
gradient_checkpointing: true

### Output
output_dir: /workspace/outputs/sft
logging_steps: 1
save_steps: 50
save_only_model: true
overwrite_output_dir: true
report_to: wandb

### No quantization (BF16 LoRA — 4-bit breaks MoE routing)
# quantization_bit: null
