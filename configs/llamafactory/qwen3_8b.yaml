# LlamaFactory SFT config for Qwen/Qwen3-8B (8B dense Qwen3ForCausalLM)
# Hermes tool format, ChatML template, QLoRA 4-bit.
#
# Usage:
#   llamafactory-cli train configs/llamafactory/qwen3_8b.yaml
#   # Or via orchestrator:
#   open-ctf-train sft --model Qwen/Qwen3-8B --data data/sft.jsonl --output outputs/sft

### Model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### Training method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### Dataset
dataset: open_ctf_sft
dataset_dir: data
template: qwen3
tool_format: qwen
cutoff_len: 8192
neat_packing: false
preprocessing_num_workers: 4
packing: true

### Output
output_dir: outputs/sft
logging_steps: 1
save_steps: 50
save_only_model: true
overwrite_output_dir: true
report_to: none

### Hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
optim: adamw_8bit
seed: 42
gradient_checkpointing: true
# flash_attn disabled: GB10 sm_121a incompatibility
# LlamaFactory does not use flash_attn param — handled via HF attn_implementation.
# Setting torch_dtype=bfloat16 + gradient_checkpointing uses SDPA by default.

### Quantization (QLoRA 4-bit for dense models)
quantization_bit: 4
quantization_method: bitsandbytes
