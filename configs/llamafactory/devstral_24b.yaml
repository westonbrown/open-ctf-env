# LlamaFactory SFT config for Devstral-Small-2-24B-Instruct (24B dense)
# Strong dense alternative — good SFT+GRPO candidate, fits single H100.
#
# Usage:
#   llamafactory-cli train configs/llamafactory/devstral_24b.yaml

### Model
model_name_or_path: mistralai/Devstral-Small-2-24B-Instruct-2512
trust_remote_code: true

### Training method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### Dataset
dataset: open_ctf_sft
dataset_dir: data
template: mistral_small
tool_format: mistral
cutoff_len: 32768
preprocessing_num_workers: 4
packing: true

### Output
output_dir: outputs/sft
logging_steps: 1
save_steps: 50
save_only_model: true
overwrite_output_dir: true
report_to: none

### Hyperparameters
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
optim: adamw_8bit
seed: 42
gradient_checkpointing: true

### Quantization (QLoRA 4-bit for dense models)
quantization_bit: 4
quantization_method: bitsandbytes
