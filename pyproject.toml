[project]
name = "open-ctf-env"
version = "0.3.0"
description = "Open-source CTF training environment with BoxPwnr agent harness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Open CTF Team"},
]

dependencies = [
    "transformers>=5.0.0,!=5.1.0",
    "trl>=0.28.0,<0.29.0",
    "datasets>=3.0.0",
    "peft>=0.14.0",
    "accelerate>=1.4.0",
    "bitsandbytes>=0.48.0",
    "gymnasium",
    "pydantic>=2.0.0",
    "docker",
    "pyyaml",
    "jsonlines",
    "rich",
]

[project.optional-dependencies]
train = ["torch>=2.4.0", "unsloth>=2026.2.1", "wandb"]
agent = ["litellm"]
gepa = ["dspy-ai>=3.1.0", "gepa>=0.0.26"]
dev = ["pytest", "ruff"]
rl = ["colorama", "ray"]

[project.scripts]
open-ctf-train = "open_ctf.cli.train:main"
open-ctf-convert = "open_ctf.cli.convert_traces:main"
open-ctf-split = "open_ctf.cli.split_dataset:main"
open-ctf-agent = "open_ctf.cli.run_agent:main"
open-ctf-eval = "open_ctf.cli.evaluate:main"
open-ctf-validate = "open_ctf.cli.validate_pipeline:main"
open-ctf-export = "open_ctf.cli.export_gguf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_ctf"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]
