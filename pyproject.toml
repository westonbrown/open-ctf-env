[project]
name = "open-ctf-env"
version = "0.4.0"
description = "Open-source CTF training environment: LlamaFactory SFT + SkyRL GRPO + GEPA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Open CTF Team"},
]

# Core dependencies — only what the CLI, data tools, reward, formatters,
# and ToolExecutor need at the top level.
# Heavy ML deps (transformers, torch, etc.) live in optional extras.
dependencies = [
    "pyyaml",
    "pydantic>=2.0.0",
    "jsonlines",
]

[project.optional-dependencies]
# LoRA merge + GGUF export (open-ctf-train merge, open-ctf-export)
# Qwen3.5-27B requires transformers>=5.2.0 for Qwen3_5ForConditionalGeneration.
merge = [
    "torch>=2.5.0",
    "transformers>=5.2.0",
    "peft>=0.15.0",
    "accelerate>=1.4.0",
]
# Stage 1: LlamaFactory SFT
# NOTE: LlamaFactory pins transformers<=4.57.1, accelerate<=1.2.1,
# datasets<=3.6.0. Do NOT override these — let LlamaFactory resolve them.
# Docker separates SFT and GRPO envs so they can have different versions.
sft = [
    "llamafactory>=0.9.0",
    "torch>=2.4.0",
    "bitsandbytes>=0.45.0",
    "deepspeed>=0.15.0",
    "wandb",
]
# Stage 1 (alt): TRL SFT — for models needing transformers >= 5.2.0 (Qwen3.5).
# Use instead of 'sft' extra when LlamaFactory's transformers pin is too old.
# Compatible with GRPO/merge extras (same transformers version).
sft-trl = [
    "trl>=0.28.0",
    "torch>=2.5.0",
    "transformers>=5.2.0",
    "peft>=0.15.0",
    "accelerate>=1.4.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.45.0",
    "wandb",
]
# Stage 2: SkyRL GRPO (online RL)
# NOTE: skyrl-train is NOT on PyPI. Install from source:
#   pip install git+https://github.com/SkyRL-Team/SkyRL-Train.git
# Qwen3.5-27B requires transformers>=5.2.0, accelerate>=1.4.0 (FSDP2).
grpo = [
    "skyrl-gym>=0.1.0",
    "ray[default]>=2.40.0",
    "torch>=2.5.0",
    "transformers>=5.2.0",
    "peft>=0.15.0",
    "accelerate>=1.4.0",
    "omegaconf",
    "hydra-core",
    "wandb",
    "jmespath",
]
# Stage 3: GEPA prompt evolution
gepa = [
    "dspy>=3.1.0",
    "gepa>=0.0.26",
]
# Agent runner (wraps BoxPwnr)
agent = [
    "litellm",
]
# Development and testing
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
open-ctf-train = "open_ctf.cli.train:main"
open-ctf-convert = "open_ctf.cli.convert_traces:main"
open-ctf-split = "open_ctf.cli.split_dataset:main"
open-ctf-agent = "open_ctf.cli.run_agent:main"
open-ctf-eval = "open_ctf.cli.evaluate:main"
open-ctf-validate = "open_ctf.cli.validate_pipeline:main"
open-ctf-export = "open_ctf.cli.export_gguf:main"
open-ctf-challenges = "open_ctf.cli.challenges:main"
open-ctf-synthetic-data = "open_ctf.cli.synthetic_data_generation:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_ctf"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]
# SFT and GRPO/merge extras have incompatible transformers versions:
#   SFT (LlamaFactory) pins transformers ≤4.57.1
#   GRPO/merge need transformers ≥5.2.0 (Qwen3.5)
# Docker separates these into different environments. Tell uv they're exclusive.
conflicts = [
    [
        { extra = "sft" },
        { extra = "grpo" },
    ],
    [
        { extra = "sft" },
        { extra = "merge" },
    ],
    [
        { extra = "sft" },
        { extra = "sft-trl" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
norecursedirs = ["references", "benchmarks", "outputs", ".venv", "venv"]
