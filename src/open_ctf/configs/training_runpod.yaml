# RunPod H200 SXM Training Configuration
# ========================================
# Online GRPO with vLLM server mode for GLM-4.7-Flash.
#
# Hardware plan: Start with 1x H200 for SFT, then 2x H200 for GRPO.
#
# SFT (1x H200, 141 GB):
#   Model NF4 (~18 GB) + LoRA (~1 GB) + optimizer (~2 GB) + activations
#   64K (~60-80 GB) + framework (~8 GB) = ~89-109 GB. Fits with headroom.
#   Launch: open-ctf-train sft --config training_runpod.yaml
#
# GRPO (2x H200, 282 GB total):
#   GPU 0: vLLM server (BF16 model ~60 GB + KV cache ~20 GB = ~80 GB)
#   GPU 1: Training (NF4 ~18 GB + LoRA ~1 GB + optimizer ~2 GB +
#           activations 16K ~30-50 GB + framework ~8 GB = ~59-79 GB)
#   Clean separation, both fit comfortably in 141 GB per GPU.
#
#   Launch (two terminals):
#     # Terminal 1: vLLM server on GPU 0
#     CUDA_VISIBLE_DEVICES=0 vllm serve unsloth/GLM-4.7-Flash \
#       --dtype bfloat16 --max-model-len 32768 \
#       --gpu-memory-utilization 0.60 \
#       --tool-call-parser glm47 --reasoning-parser glm45 \
#       --enable-auto-tool-choice --host 0.0.0.0 --port 8000
#
#     # Terminal 2: Training on GPU 1
#     CUDA_VISIBLE_DEVICES=1 open-ctf-train grpo \
#       --config training_runpod.yaml
#
# Why NOT 4x H200:
#   DDP with batch_size=1 gives zero parallelism (each GPU processes same
#   sample). TP=2 for vLLM is overkill for a 60 GB model. 4x doubles cost
#   for <1.5x speedup. 2x is the sweet spot.
#
# Cost estimates (659 GRPO prompts, online mode):
#   SFT:  1x H200, ~2-3 hr, ~$7-10
#   GRPO: 2x H200, ~5-8 hr (avg 3-5 tool iters), ~$36-58

model:
  name: "unsloth/GLM-4.7-Flash"
  # 64K captures 97% of SFT traces (vs 85% at 32K).
  # H200 has ample headroom for 64K context with NF4 quantization.
  max_seq_length: 65536
  # 4-bit NF4: model ~18 GB. Frees VRAM for longer completions.
  load_in_4bit: true
  load_in_8bit: false

lora:
  r: 64
  # alpha=2r: standard ratio for stronger LoRA signal through the bottleneck.
  alpha: 128
  dropout: 0
  # Attention + shared expert layers. Routed MoE expert 3D tensors are NOT
  # LoRA'd (per Unsloth MoE recommendation — PEFT only matches nn.Module).
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

sft:
  # 5 epochs: OpenThoughts research shows short SFT (1-3 epochs) can underfit
  # with <1K samples, causing unstable RL downstream. 5 is the sweet spot.
  epochs: 5
  # batch_size=1 required for GLM-4.7-Flash MoE (NaN gradients with padding).
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  packing: true
  # Memory budget for SFT on 1x H200 (141 GB VRAM):
  #   Model (NF4): ~17 GB
  #   LoRA adapters: ~1 GB
  #   Optimizer (8-bit AdamW): ~2 GB
  #   Gradient activations (checkpointed, 64K): ~60-80 GB
  #   Framework/OS: ~8 GB
  #   Total: ~88-108 GB -> ~33-53 GB headroom

grpo:
  epochs: 1
  batch_size: 1
  # batch_size(1) * grad_accum(8) % num_gen(8) = 0 (valid).
  # Effective batch = 1 * 8 / 8 = 1 prompt per optimizer step.
  # 659 samples / 8 = 82 optimizer steps per epoch.
  gradient_accumulation_steps: 8
  # 1e-6: Standard GRPO rate for MoE models. Expert activation volatility
  # amplifies gradient noise; lower LR prevents catastrophic forgetting.
  # Reference: DeepSeekMath GRPO, ToolRL, DeepSWE all use 1e-6.
  learning_rate: 1.0e-6
  warmup_ratio: 0.10
  # beta=0.0: DAPO formulation. No KL penalty — replaced by epsilon clipping.
  beta: 0.0
  loss_type: dapo
  # Fission-GRPO: 8 generations -> C(8,2) = 28 pairwise comparisons per prompt.
  num_generations: 8
  # 16K completions: p95 of actual traces is 12,845 tokens. 16K captures 97%+
  # of realistic completions while halving KV cache vs 32K.
  # Online mode generates incrementally (tool call iterations), so individual
  # turns are much shorter than full traces.
  max_completion_length: 16384
  # 15 tool iterations: enough for complex multi-step CTF (recon + enum + exploit).
  # Each iteration = generate -> parse tool calls -> execute -> regenerate.
  max_tool_calling_iterations: 15
  max_grad_norm: 0.1
  # DAPO epsilon clipping: bounds per-token importance ratio to [1-eps, 1+eps_high].
  # 0.28 is the standard DAPO value (wider than PPO's 0.2 for more exploration).
  epsilon_high: 0.28
  weight_decay: 0.1
  # DAPO: no reward normalization needed (group-relative baseline centers rewards).
  scale_rewards: false
  # vLLM server mode: generation offloaded to GPU 0's vLLM process.
  # Avoids weight sync and mixed-dtype bugs from colocate mode on MoE.
  # vLLM 0.16.0 supports GLM-4.7-Flash natively (PR #34124).
  use_vllm: true
  vllm_mode: "server"
  # vLLM server GPU memory utilization on GPU 0.
  # 0.60: model BF16 ~60 GB + KV cache ~20 GB = ~80 GB out of 141 GB.
  # Leaves ~61 GB free for OS/framework overhead.
  gpu_memory_utilization: 0.60
  # Memory budget for GRPO (2x H200, online mode):
  #
  # GPU 0 — vLLM server (dedicated):
  #   GLM-4.7-Flash BF16 weights: ~60 GB
  #   KV cache (8 gen * 16K tok): ~10-15 GB
  #   Framework/OS: ~5 GB
  #   Total: ~75-80 GB (gpu_mem_util=0.60 → ~85 GB allocated)
  #   Headroom: ~56 GB
  #
  # GPU 1 — Training (dedicated):
  #   Model NF4: ~18 GB
  #   LoRA adapters: ~1 GB
  #   Optimizer (8-bit AdamW): ~2 GB
  #   Gradient activations (checkpointed, 16K): ~30-50 GB
  #   Framework/OS: ~8 GB
  #   Total: ~59-79 GB
  #   Headroom: ~62-82 GB
  #
  # Online GRPO time estimate (659 prompts, 8 gen, avg 3-5 tool iters):
  #   Generation: ~500 tok/iter * avg_iters * 8 gen / ~3000 tok/s + 1s tool exec
  #   Per-prompt: ~12-20s (3 iters) to ~20-33s (5 iters)
  #   Backward: ~4s per optimizer step (82 total)
  #   Total: ~5-8 hours on 2x H200
  #   Cost: 2 * $3.59/hr * 5-8 hr = ~$36-58

output:
  save_steps: 25
  logging_steps: 1
  # W&B logging for RunPod runs.
  report_to: wandb
