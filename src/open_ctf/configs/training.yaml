# Open CTF Training Configuration
# ==================================================
# Used by: open-ctf-train (src/open_ctf/cli/train.py)
#
# Default model: Nanbeige4.1-3B (3B dense LlamaForCausalLM)
# For GLM-4.7-Flash (30B MoE): use training_120gb_moe.yaml or training_140gb_moe.yaml.
# For Nanbeige on DGX Spark (GB10): use training_120gb_dense.yaml for tuned memory budgets.

model:
  name: "Nanbeige/Nanbeige4.1-3B"
  max_seq_length: 32768
  # QLoRA 4-bit works for dense Llama models (no MoE expert tensor workarounds needed).
  load_in_4bit: true

lora:
  r: 64
  alpha: 128
  dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

sft:
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  packing: true

grpo:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  warmup_ratio: 0.10
  beta: 0.0
  loss_type: dapo
  num_generations: 8
  max_completion_length: 32768
  max_grad_norm: 0.1
  epsilon_high: 0.28
  weight_decay: 0.1
  scale_rewards: false
  # Advantage estimator: rloo_n (REINFORCE Leave-One-Out, normalized).
  # Alternatives: grpo, rloo, reinforce++, gae.
  advantage_estimator: rloo_n
  # vLLM for fast generation (3-6x faster than HF generate).
  # LlamaForCausalLM is first-class in vLLM — no special parsers needed.
  use_vllm: true
  vllm_mode: colocate
  gpu_memory_utilization: 0.4
  # Online training: max tool-calling iterations per generation.
  max_tool_calling_iterations: 15

reward:
  # CTFReward weights (must sum to 1.0).
  # Uncomment and adjust to override defaults from reward.py.
  # flag_weight: 0.20
  # efficiency_weight: 0.25
  # progression_weight: 0.15
  # format_weight: 0.20
  # exploration_weight: 0.10
  # uniqueness_weight: 0.10

output:
  save_steps: 50
  logging_steps: 1
  report_to: wandb
