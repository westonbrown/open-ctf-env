# Open CTF Training Configuration (Cloud H100/H200)
# ==================================================
# Used by: open-ctf-train (src/open_ctf/cli/train.py)
# For DGX Spark (GB10): use training_dgx.yaml instead.

model:
  name: "unsloth/GLM-4.7-Flash"
  max_seq_length: 4096
  # GLM-4.7-Flash is MoE — 4-bit QLoRA not supported for MoE models.
  # Use BF16 LoRA. Set to true only for dense models (e.g. Devstral).
  load_in_4bit: false

lora:
  r: 64
  alpha: 64
  dropout: 0
  # GLM-4.7-Flash uses o_proj (not out_proj). Router layers excluded by default.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

sft:
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  packing: true

grpo:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  warmup_ratio: 0.10
  beta: 0.0
  loss_type: dapo
  # Default: 8 generations, 4096 completions (cloud H200).
  # DGX Spark (GB10, 120GB): use num_generations=2, max_completion_length=512
  # via env overrides or --config pointing to a DGX-specific yaml.
  num_generations: 8
  max_completion_length: 4096
  max_grad_norm: 0.1
  epsilon_high: 0.28
  weight_decay: 0.1
  scale_rewards: "batch"
  # vLLM for fast generation (3-6x faster than HF generate).
  # Requires model architecture supported by vLLM.
  use_vllm: true
  vllm_mode: colocate
  gpu_memory_utilization: 0.6
  # OpenEnv online training: max tool-calling iterations per generation.
  max_tool_calling_iterations: 15

output:
  save_steps: 50
  logging_steps: 1
  report_to: wandb
