# Open CTF Training Configuration
# ================================
# Used by: open-ctf-train (src/open_ctf/cli/train.py)

model:
  name: "unsloth/GLM-4.7-Flash"
  # Reduced from 8192 to 4096 for GB10 memory budget (~60GB model + training overhead)
  max_seq_length: 4096
  # GLM-4.7-Flash is MoE - 4-bit QLoRA NOT supported for MoE models.
  # Use BF16 LoRA (~60GB VRAM). Set to true only for dense models.
  load_in_4bit: false

lora:
  r: 64
  alpha: 64
  dropout: 0
  # GLM-4.7-Flash uses o_proj (not out_proj). Router layers excluded by default.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

sft:
  epochs: 3
  # Reduced from 2 to 1 for GB10 memory budget
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  packing: true

grpo:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  warmup_ratio: 0.10
  beta: 0.0
  loss_type: dapo
  num_generations: 8
  max_completion_length: 4096
  max_grad_norm: 0.1
  epsilon_high: 0.28
  weight_decay: 0.1
  # "batch" uses batch-level std with group-level mean — more robust than "group"
  scale_rewards: "batch"
  # GRPO uses FP16 (set in code) — better gradient stability for RL

output:
  save_steps: 50
  logging_steps: 1
  report_to: wandb
