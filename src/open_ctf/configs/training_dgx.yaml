# DGX Spark (GB10) Training Configuration
# =========================================
# Reduced GRPO params to fit in 120GB unified memory.
# SFT and LoRA settings inherited from training.yaml.

model:
  name: "unsloth/GLM-4.7-Flash"
  max_seq_length: 4096
  load_in_4bit: false

lora:
  r: 64
  alpha: 64
  dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

sft:
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  packing: true

grpo:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  warmup_ratio: 0.10
  beta: 0.0
  loss_type: dapo
  # Memory budget (GB10 unified 120GB):
  #   Model weights: ~60GB  |  Framework/OS: ~10GB  |  Available: ~48GB
  #   KV cache (6 gen × 2048 tokens): ~2.6GB
  #   Training (gradients, optimizer, activations): ~22GB
  #   Headroom: ~23GB
  #
  # Bumped generations to 6 to properly utilize GRPO advantage estimation
  # while staying well within the ~48GB available training memory bound.
  num_generations: 6
  # 2048 is safe for multi-turn length while allowing 6 generations.
  max_completion_length: 2048
  max_grad_norm: 0.1
  epsilon_high: 0.28
  weight_decay: 0.1
  scale_rewards: "batch"
  # vLLM for fast generation (3-6x faster than HF generate).
  # TRL's native integration: model loaded once, shared between
  # vLLM (generation) and trainer (backward pass). colocate mode
  # required for single-GPU — no double model loading.
  # vLLM: GLM-4.7-Flash (Glm4MoeLiteForCausalLM) not yet supported in
  # vLLM 0.14.2 (scitrera/dgx-spark-vllm). Supported: Glm4MoeForCausalLM.
  # Needs vLLM nightly. For now, HF generate works with prefix-preserving
  # patch in open-ctf-grpo:v2 Dockerfile.
  use_vllm: false
  gpu_memory_utilization: 0.3

output:
  save_steps: 25
  logging_steps: 1
  report_to: none
